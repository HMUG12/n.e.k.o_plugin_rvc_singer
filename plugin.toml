[plugin]
id = "rvc_singer"
name = "RVC歌声合成"
description = "让N.E.K.O用训练好的RVC模型唱歌。用户说出'唱首歌'等请求后，插件会获取上下文、转发给RVC Studio独立程序处理音频，合成完整的歌曲并驱动口型同步。"
short_description = "RVC AI singing voice conversion — turn any song into N.E.K.O's voice with lip-sync. Trigger: '唱首歌', 'sing a song', '歌って'"
keywords = ["唱歌", "唱一首", "来一首", "唱首歌", "唱支歌", "sing", "song", "singing", "歌声", "演唱", "歌曲", "音楽", "歌って", "노래", "cover", "翻唱", "下载歌曲", "找歌", "搜索歌曲", "搜歌", "帮我找", "下载音乐", "找音乐", "对比", "音色对比", "A/B", "AB对比", "哪个模型", "试听", "compare", "模型", "声音", "音色", "换模型", "切换模型", "用什么唱", "哪些模型", "可用模型", "model", "voice"]
version = "0.0.3"
entry = "plugins.rvc_singer:RvcSingerPlugin"

[plugin.author]
name = "RVC Studio"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "RVC 歌声合成"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = [
    "state:read",
    "config:read",
    "action:call",
]

[[plugin.ui.panel]]
id = "player"
title = "演唱播放器"
entry = "static/player.html"
context = "dashboard"
permissions = ["state:read"]

[[plugin.ui.guide]]
id = "quickstart"
title = "快速开始"
entry = "docs/quickstart.md"
permissions = ["state:read"]

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

# RVC Studio 独立程序配置
# 注意：首次使用请在 UI 面板的"配置"标签页中设置正确的路径
[settings]
rvc_studio_host = "127.0.0.1"
rvc_studio_port = 19877
rvc_root_path = ""
default_model = ""
auto_mix_background = true
# ── P2: 远程连接加固（本地默认全关，行为不变）──
api_key = ""          # B 端启动参数 --api-key（或环境变量 RVC_STUDIO_API_KEY）一致时填写
use_https = false     # B 端启用 --ssl-cert/--ssl-key 时置 true
ssl_verify = true     # 自签证书场景可置 false（跳过证书校验）
